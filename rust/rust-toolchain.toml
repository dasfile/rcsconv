# Toolchain: stable channel. The host is chosen by the installation (on the owner's
# machine a portable toolchain in `C:\rust`, no `rustup`; see README). Only `rustup`
# reads this file: without it the file is inert, while CI (Ubuntu) uses it to pick
# the channel. Pinning a triple here would break the Linux/CI build.
[toolchain]
channel = "stable"
profile = "minimal"

