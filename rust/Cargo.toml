[workspace]
members = ["cloud-las", "cloud-pts", "rcs-cloud", "rcs-conv", "rcs-format", "rcsconv", "rcsconv-ffi", "rcsconv-gui"]
resolver = "2"

# Release profile for the "one static .exe" requirement (docs/ROADMAP.md 1, 3).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# unwind rather than abort: the GUI (`rcsconv-gui`) catches a worker panic with
# `catch_unwind` and shows an error box instead of disappearing silently
# (owner's decision, docs/ROADMAP.md 4.1). Cost: about 40 KB in the binary.
panic = "unwind"
