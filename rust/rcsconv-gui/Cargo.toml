[package]
name = "rcsconv-gui"
version = "1.0.1"
edition = "2021"
rust-version = "1.75"
description = "Win32 GUI for rcsconv (.las/.laz/.pts -> ReCap .rcs)"
license = "MIT"

[[bin]]
name = "rcsconv-gui"
path = "src/main.rs"

[dependencies]
rcs-conv = { path = "../rcs-conv" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
