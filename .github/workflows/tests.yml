name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The data (golden/) is not in the repository: tests that need the reference
      # files mark themselves with SkipTest, so the run is green without the corpus.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy laspy

      - name: Run tests
        run: python -m unittest discover -s tools/tests -v

  # Rust port: crate tests. The data (golden/) is not needed — parity tests print
  # "skipped" and pass, like SkipTest in Python.
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: cargo test --workspace --manifest-path rust/Cargo.toml
